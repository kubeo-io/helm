name: Build Helm Chart

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-helm@v4.2.0
      - uses: actions/checkout@v4

      - name: Lint and render all test values
        run: bash run-test.sh chart/app test

      - name: Validate rendered manifests against Kubernetes and CRD schemas
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          for values in test/*.yml; do
            echo "== $values"
            helm template ci chart/app -f "$values" -s templates/httproute.yaml 2>/dev/null \
              | ./kubeconform -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              || exit 1
          done

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-helm@v4.2.0
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate Semantic Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          bump_each_commit: false
          search_commit_body: true
          debug: true
          major_pattern: /^(major|break)/
          minor_pattern: /^(feat|feature|refactor|revert|style)/

      - name: Echo version
        run: |
          echo "Variables:"
          echo "Previous version:   ${{ steps.version.outputs.previous_version }}"
          echo "Generated version:  ${{ steps.version.outputs.version }}"
          echo "Generated tag:      ${{ steps.version.outputs.version_tag }}"
          
      - name: Build
        run: |
          echo "Building Helm chart..."
          echo "${{ secrets.GH_TOKEN }}" | helm registry login ghcr.io -u ${{ secrets.GH_USERNAME }} --password-stdin

          CHART_NAME="app"
          CHART_VERSION="${{ steps.version.outputs.version }}"
          echo "Packaging chart..."
          if [ -z "chart/${CHART_NAME}" ]; then
              echo "Chart name is not provided. Exiting."
              exit 1
          fi

          helm package chart/${CHART_NAME} --version ${CHART_VERSION} -d .
          if [ $? -ne 0 ]; then
              echo "Failed to package the chart."
              exit 1
          fi

          echo "Pushing chart to registry..."
          helm push ${CHART_NAME}-${CHART_VERSION}.tgz oci://ghcr.io/kubeo-io

      - name: Create Release
        uses: ncipollo/release-action@v1.16.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          tag: ${{ steps.version.outputs.version_tag }}
          name: ${{ steps.branch.outputs.releaseName }}
          body: ${{ github.event.head_commit.message }}
          token: ${{ secrets.GH_TOKEN }}