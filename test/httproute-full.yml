# HTTPRoute: several hosts/listeners, custom rules, backend override,
# redirect-only rule and a Service with multiple ports.
service:
  enabled: true
  ports:
    - port: 8080
    - port: 9090
      name: metrics

httpRoute:
  enabled: true
  annotations:
    example.com/owner: team-a
  labels:
    exposure: public
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https-app
    - name: public
      namespace: envoy-gateway-system
      sectionName: https-www-app
  hostnames:
    - app.example.com
    - www.app.example.com
  rules:
    - matches:
        - headers:
            - name: host
              value: www.app.example.com
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: app.example.com
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - port: 9090
    - matches:
        - path:
            type: PathPrefix
            value: /legacy
      backendRefs:
        - name: legacy-svc
          port: 80
          weight: 10
      timeouts:
        request: 30s
    - matches:
        - path:
            type: PathPrefix
            value: /
